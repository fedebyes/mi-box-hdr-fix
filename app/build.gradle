plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.fedebyes.deepcolortoggle'
    compileSdk 36

    defaultConfig {
        applicationId "dev.fedebyes.deepcolortoggle"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
